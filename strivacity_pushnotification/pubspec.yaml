name: strivacity_pushnotification
description: "Push-based multi-factor authentication for Flutter apps on Android and iOS: enroll a device, receive sign-in challenges, and approve, deny or answer them."
version: 0.0.1
homepage: https://strivacity.com
repository: https://github.com/strivacity/strivacity_pushnotification
publish_to: none

platforms:
  android:
  ios:

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.6

flutter:
  plugin:
    platforms:
      android:
        package: com.strivacity.flutter.strivacity_pushnotification
        pluginClass: StrivacityPushnotificationPlugin
      ios:
        pluginClass: StrivacityPushnotificationPlugin

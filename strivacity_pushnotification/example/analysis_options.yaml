# The example app inherits the plugin's strict analysis configuration, with a
# few rules relaxed because this is an app rather than a published API surface.
include: ../analysis_options.yaml

linter:
  rules:
    # The example is not a published package, so its members need no dartdoc.
    public_member_api_docs: false
    # The example imports the plugin through its `package:` URI on purpose.
    prefer_relative_imports: false

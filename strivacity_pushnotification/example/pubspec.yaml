name: strivacity_pushnotification_example
description: "Demonstrates how to use the strivacity_pushnotification plugin."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  firebase_core:
  firebase_messaging:
  strivacity_pushnotification:
    path: ../
  flutter_svg: ^2.3.0
  mobile_scanner: ^7.4.2
  signals_core: ^7.0.0
  signals_flutter: ^7.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Overpass (SIL Open Font License, see assets/Overpass/OFL.txt), the app's typeface
  fonts:
    - family: Overpass
      fonts:
        - asset: assets/Overpass/static/Overpass-Light.ttf
          weight: 300
        - asset: assets/Overpass/static/Overpass-Regular.ttf
          weight: 400
        - asset: assets/Overpass/static/Overpass-Medium.ttf
          weight: 500
        - asset: assets/Overpass/static/Overpass-SemiBold.ttf
          weight: 600
        - asset: assets/Overpass/static/Overpass-Bold.ttf
          weight: 700